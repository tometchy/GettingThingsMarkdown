name: Build and tests
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore tests/ControlPlane.Tests/ControlPlane.Tests.csproj
      - run: dotnet test tests/ControlPlane.Tests/ControlPlane.Tests.csproj --no-restore --configuration Release
      - run: dotnet build src/Client/Desktop/GettingThingsMarkdown.Client.Desktop.csproj --configuration Release
      - run: dotnet build src/MailIngress/GettingThingsMarkdown.MailIngress.csproj --configuration Release
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install wasm-tools
      - run: dotnet publish src/Client/Browser/GettingThingsMarkdown.Client.Browser.csproj --configuration Release
      - uses: actions/upload-artifact@v4
        with:
          name: account-ui-browser
          path: src/Client/Browser/bin/Release/net10.0-browser/publish/wwwroot/
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Git-only mailbox commit and failed push retry
        run: |
          python3 tests/integration/git-mail-writer.py
          python3 tests/integration/storage-budget.py
          python3 tests/integration/logical-history.py
          python3 tests/integration/git-integrity.py
          python3 tests/integration/disk-health.py
          python3 tests/integration/storage-controller.py
          python3 tests/integration/authorized-rebuild.py
          python3 tests/integration/worktree-integrity.py
          python3 tests/integration/recovery-witness.py
          python3 tests/integration/witness-api.py
          python3 tests/integration/stage-runner.py
          python3 tests/integration/writer-fencing.py
          python3 tests/integration/host-runtime-fence.py
          python3 tests/integration/namespace-fence.py
          python3 tests/integration/local-lvm-fence.py
          python3 tests/integration/lvm-mount-binding.py
          python3 tests/integration/recovery-source.py
          python3 tests/integration/recovery-binding.py
          python3 tests/integration/history-purge-candidate.py
      - name: Verify real three-member etcd witness quorum
        run: bash tests/integration/witness-etcd.sh
      - name: Test storage-health Prometheus alert rules
        run: |
          docker run --rm -v "$PWD/infrastructure/storage-health:/rules:ro" \
            -w /rules --entrypoint /bin/promtool prom/prometheus:v3.5.0 test rules prometheus-rules.test.yaml
      - name: Build and test independent encrypted Control Plane backup
        run: |
          docker build -f server/controlplane-backup/Dockerfile -t gtm/controlplane-backup:ci .
          bash tests/integration/controlplane-backup.sh
  storage-lvm:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install LVM test prerequisites on ephemeral runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends lvm2 e2fsprogs
      - name: Verify per-PVC isolation on real loop-backed Linux device mapper
        run: sudo --preserve-env=GITHUB_ACTIONS python3 tests/integration/local-lvm-fence-real.py
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Validate storage pricing assumptions
        run: python3 -m unittest discover -s tests/pricing -p 'test_*.py' -v
      - name: Validate local scripts
        run: |
          bash -n dev.sh tests/integration/*.sh scripts/recovery/*.sh packaging/linux/bundle-syncthing.sh
          for f in server/sync/*.sh server/history/*.sh; do sh -n "$f"; done
      - name: Verify immutable backup rejects weak retention
        run: bash tests/security/worm-fail-closed.sh
      - name: Build independent witness image
        run: docker build -f server/recovery-witness/Dockerfile -t gtm/recovery-witness:ci .
      - name: Build Control Plane image
        run: docker build -f src/ControlPlane/Dockerfile -t gtm/controlplane:ci .
      - name: Build standalone shared SMTP gateway image
        run: docker build -f src/MailIngress/Dockerfile -t gtm/mail-ingress:ci .
      - name: Build encrypted Sync/Git image
        run: docker build -f server/sync/Dockerfile -t gtm/sync:ci .
      - name: Build Gitea History image
        run: docker build -f server/history/Dockerfile -t gtm/history:ci .
      - name: Verify encrypted Syncthing identity backup and restore
        run: bash tests/integration/identity-backup.sh
      - name: Prove full Git restoration in both directions (without LFS)
        run: bash tests/integration/full-git-recovery.sh
      - name: Verify tenant-prefixed Git LFS in local S3 emulator
        run: bash tests/integration/lfs-s3-moto.sh
      - name: Start disposable kind cluster for integration
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: gtm
          config: infrastructure/kind/config.yaml
      - name: Load real images and start API
        run: |
          kind load docker-image --name gtm gtm/controlplane:ci gtm/sync:ci gtm/history:ci gtm/mail-ingress:ci
          docker tag gtm/controlplane:ci gtm/controlplane:dev
          docker tag gtm/sync:ci gtm/sync:dev
          docker tag gtm/history:ci gtm/history:dev
          docker tag gtm/mail-ingress:ci gtm/mail-ingress:dev
          kind load docker-image --name gtm gtm/controlplane:dev gtm/sync:dev gtm/history:dev gtm/mail-ingress:dev
          kubectl apply -f infrastructure/kubernetes/control-plane.yaml
          kubectl -n gtm-system create secret generic controlplane-secrets \
            --from-literal=jwt="$(openssl rand -hex 32)" \
            --from-literal=admin="$(openssl rand -hex 32)"
          kubectl -n gtm-system rollout status deployment/controlplane --timeout=300s
      - name: Run real two-tenant provisioning smoke test
        run: |
          kubectl -n gtm-system port-forward service/controlplane 5080:8080 >/tmp/gtm-forward.log 2>&1 &
          pf=$!
          trap 'kill "$pf" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5080/healthz >/dev/null; then break; fi
            sleep 2
          done
          bash tests/integration/kind-smoke.sh
          source /tmp/gtm-kind-e2e-account.env
          bash tests/integration/e2ee-git.sh
      - name: SMTP STARTTLS to encrypted Git mail over real kind networking
        run: |
          openssl req -new -newkey rsa:3072 -sha256 -days 1 -nodes -x509 \
            -subj '/CN=inbox.test.invalid' -keyout /tmp/gtm-smtp.key \
            -out /tmp/gtm-smtp.crt >/dev/null 2>&1
          kubectl -n gtm-system create secret tls gtm-mail-tls \
            --cert=/tmp/gtm-smtp.crt --key=/tmp/gtm-smtp.key
          token="$(openssl rand -hex 32)"
          kubectl -n gtm-system create secret generic gtm-mail-secret \
            --from-literal=mail-ingress-token="$token"
          kubectl -n gtm-system set env deployment/controlplane \
            GTM_INBOUND_MAIL_DOMAIN=inbox.test.invalid GTM_MAIL_INGRESS_TOKEN="$token"
          kubectl -n gtm-system rollout status deployment/controlplane --timeout=240s
          kubectl apply -f infrastructure/kubernetes/mail-ingress-dev.yaml
          kubectl -n gtm-system rollout status deployment/mail-ingress --timeout=240s
          kubectl -n gtm-system port-forward service/controlplane 5081:8080 >/tmp/gtm-mail-api.log 2>&1 &
          pf_api=$!
          kubectl -n gtm-system port-forward service/mail-ingress 2525:2525 >/tmp/gtm-mail-smtp.log 2>&1 &
          pf_smtp=$!
          trap 'kill "$pf_api" "$pf_smtp" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5081/readyz >/dev/null 2>&1 &&
               bash -c 'echo > /dev/tcp/127.0.0.1/2525' >/dev/null 2>&1; then break; fi
            sleep 2
          done
          bash tests/integration/smtp-gateway.sh
      - name: Dump diagnostic logs if integration fails
        if: failure()
        run: |
          kubectl get pods -A -o wide || true
          kubectl -n gtm-system logs deployment/controlplane --tail=200 || true
          for ns in $(kubectl get namespace -o name | grep namespace/gtm- | sed 's@namespace/@@'); do
            kubectl -n "$ns" logs sync-0 --tail=60 || true
            kubectl -n "$ns" logs history-0 --tail=60 || true
          done
  storage-controller-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build only the storage controller
        run: docker build -f server/storage-controller/Dockerfile -t gtm/storage-controller:ci .
      - uses: helm/kind-action@v1.14.0
        id: kind_ready
        with:
          cluster_name: gtm
          config: infrastructure/kind/config.yaml
      - uses: azure/setup-helm@v4.3.0
        id: helm_ready
        with:
          version: v3.17.4
      - name: Load controller and create its system namespace
        id: controller_ready
        run: |
          kind load docker-image --name gtm gtm/storage-controller:ci
          kubectl create namespace gtm-system
      - name: Verify storage controller against real Kubernetes PV binder
        run: bash tests/integration/storage-controller-kind.sh
      - name: Verify real host CRI inspection and scoped sandbox stop
        if: ${{ !cancelled() && steps.kind_ready.outcome == 'success' && steps.helm_ready.outcome == 'success' && steps.controller_ready.outcome == 'success' }}
        run: python3 tests/integration/host-runtime-kind.py
      - name: Verify signed freeze admission barrier against real Kubernetes
        if: ${{ !cancelled() && steps.kind_ready.outcome == 'success' && steps.helm_ready.outcome == 'success' && steps.controller_ready.outcome == 'success' }}
        run: python3 tests/integration/namespace-fence-kind.py
  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.4
      - name: Validate Helm chart and render non-public defaults
        run: |
          helm lint infrastructure/helm/gtm-controlplane
          helm template gtm infrastructure/helm/gtm-controlplane > /tmp/gtm-helm-manifest.yaml
          grep -q 'kind: Deployment' /tmp/gtm-helm-manifest.yaml
          helm template gtm infrastructure/helm/gtm-controlplane \
            --set billing.existingSecret=ci-billing \
            --set mail.existingSecret=ci-mail > /tmp/gtm-helm-with-billing.yaml
          grep -q 'GTM_STRIPE_PRICE_BASIC_YEAR' /tmp/gtm-helm-with-billing.yaml
          grep -q 'GTM_SMTP_PASSWORD' /tmp/gtm-helm-with-billing.yaml
          helm template gtm infrastructure/helm/gtm-controlplane \
            --set mailIngress.enabled=true \
            --set mailIngress.domain=inbox.example.test \
            --set mailIngress.tlsSecret=existing-smtp-tls \
            --set mailIngress.tokenSecret=existing-inbound-token > /tmp/gtm-mail.yaml
          grep -q 'name: mail-ingress' /tmp/gtm-mail.yaml
          grep -q 'GTM_INBOUND_MAIL_DOMAIN' /tmp/gtm-mail.yaml
          helm template gtm infrastructure/helm/gtm-controlplane \
            --set stateBackup.enabled=true \
            --set stateBackup.existingSecret=ci-backup \
            --set-string recovery.ageRecipient=ci-render-only > /tmp/gtm-backup.yaml
          grep -q 'name: state-backup' /tmp/gtm-backup.yaml
          grep -q 'name: GTM_BACKUP_ENDPOINT_A' /tmp/gtm-backup.yaml
      - name: Validate optional storage controller and audit-only default
        run: |
          helm template gtm infrastructure/helm/gtm-controlplane \
            --set storageController.enabled=true \
            --set storageController.inventoryConfigMap=ci-inventory > /tmp/storage-controller.yaml
          grep -q 'name: gtm-storage-controller' /tmp/storage-controller.yaml
          ! grep -q -- '--reserve-available' /tmp/storage-controller.yaml
          helm template gtm infrastructure/helm/gtm-controlplane \
            --set storageController.enabled=true \
            --set storageController.inventoryConfigMap=ci-inventory \
            --set storageController.reserveAvailable=true \
            --set storageController.managedClasses[0]=ci-local > /tmp/storage-controller-write.yaml
          grep -q -- '--reserve-available' /tmp/storage-controller-write.yaml
          grep -q 'kind: ValidatingAdmissionPolicyBinding' /tmp/storage-controller-write.yaml
      - name: Validate optional writer freeze admission policy
        run: |
          helm template gtm infrastructure/helm/gtm-controlplane > /tmp/gtm-no-writer-fence.yaml
          ! grep -q 'gtmd-frozen-namespace-no-writers' /tmp/gtm-no-writer-fence.yaml
          helm template gtm infrastructure/helm/gtm-controlplane --set writerFence.enabled=true > /tmp/gtm-writer-fence.yaml
          grep -q 'gtmd-frozen-namespace-no-writers' /tmp/gtm-writer-fence.yaml
          grep -q 'gtmd-writer-freeze-marker' /tmp/gtm-writer-fence.yaml
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.0
      - name: Validate Scaleway module without deploying
        working-directory: infrastructure/terraform/scaleway
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false -input=false
          tofu validate
