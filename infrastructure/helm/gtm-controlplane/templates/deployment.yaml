apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
  namespace: {{ .Values.namespace | quote }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gtm-controlplane
  template:
    metadata:
      labels:
        app: gtm-controlplane
    spec:
      serviceAccountName: gtm-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: controlplane
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: {{ ternary "Development" "Production" .Values.development.enabled | quote }}
            - name: GTM_KUBE_ENABLED
              value: "true"
            - name: GTM_DEV_LONG_TRIAL
              value: {{ and .Values.development.enabled .Values.development.longTrial | quote }}
            - name: GTM_DEV_VOLUME_GI
              value: {{ .Values.development.tenantVolumeGi | quote }}
            - name: GTM_ISOLATE_LIVE_VOLUME
              value: {{ .Values.storage.isolateLiveVolume | quote }}
            - name: GTM_SYNC_STORAGE_CLASS
              value: {{ .Values.storage.syncClassName | quote }}
            - name: GTM_HISTORY_STORAGE_CLASS
              value: {{ .Values.storage.historyClassName | quote }}
            - name: GTM_RECOVERY_AGE_RECIPIENT
              value: {{ .Values.recovery.ageRecipient | quote }}
            - name: GTM_FAILOVER_TARGET_CLOUD
              value: {{ .Values.recovery.failoverTargetCloud | quote }}
            - name: GTM_FENCE_ACKNOWLEDGED
              value: {{ .Values.recovery.fenceAcknowledged | quote }}
            - name: GTM_SYNC_CLOUD
              value: {{ .Values.placement.syncCloud | quote }}
            - name: GTM_HISTORY_CLOUD
              value: {{ .Values.placement.historyCloud | quote }}
            - name: GTM_GIT_LFS_ENABLED
              value: {{ .Values.encryptedArchive.lfsEnabled | quote }}
            - name: GTM_WORM_BACKUP_ENABLED
              value: {{ .Values.encryptedArchive.wormBackupEnabled | quote }}
            - name: GTM_SYNC_IMAGE
              value: {{ .Values.syncImage | quote }}
            - name: GTM_HISTORY_IMAGE
              value: {{ .Values.historyImage | quote }}
            - name: GTM_ADMIN_API_ENABLED
              value: {{ .Values.adminApi.enabled | quote }}
            - name: GTM_DB
              value: "Data Source=/app/data/accounts.sqlite"
            - name: GTM_PROVISIONING_DB
              value: "Data Source=/app/data/tenants.sqlite"
            - name: GTM_PUBLIC_URL
              value: {{ printf "https://%s" .Values.api.host | quote }}
            - name: GTM_WEB_ORIGIN
              value: {{ printf "https://%s" .Values.api.host | quote }}
            {{- if .Values.mailIngress.enabled }}
            - name: GTM_INBOUND_MAIL_DOMAIN
              value: {{ .Values.mailIngress.domain | quote }}
            - name: GTM_MAIL_INGRESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mailIngress.tokenSecret | quote }}
                  key: mail-ingress-token
            {{- end }}
            - name: GTM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: jwt
            - name: GTM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: admin
            {{- if .Values.billing.existingSecret }}
            - name: GTM_STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.existingSecret | quote }}
                  key: stripe-key
            - name: GTM_STRIPE_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.billing.existingSecret | quote }}
                  key: stripe-webhook-secret
            {{- range $plan := list "BASIC" "PLUS" "PRO" }}
            {{- range $period := list "MONTH" "YEAR" }}
            - name: GTM_STRIPE_PRICE_{{ $plan }}_{{ $period }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.billing.existingSecret | quote }}
                  key: price-{{ $plan | lower }}-{{ $period | lower }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.mail.existingSecret }}
            - name: GTM_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mail.existingSecret | quote }}
                  key: smtp-host
            - name: GTM_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mail.existingSecret | quote }}
                  key: smtp-port
            - name: GTM_SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mail.existingSecret | quote }}
                  key: smtp-username
            - name: GTM_SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mail.existingSecret | quote }}
                  key: smtp-password
            - name: GTM_SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mail.existingSecret | quote }}
                  key: smtp-from
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
        {{- if .Values.stateBackup.enabled }}
        # Shared backup process only, not an extra container per tenant.
        - name: state-backup
          image: {{ .Values.stateBackup.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: GTM_RECOVERY_AGE_RECIPIENT
              value: {{ required "stateBackup requires recovery.ageRecipient (two independent age keys)" .Values.recovery.ageRecipient | quote }}
            - name: GTM_BACKUP_INTERVAL_SECONDS
              value: {{ .Values.stateBackup.intervalSeconds | quote }}
            - name: AWS_SHARED_CREDENTIALS_FILE
              value: /backup-auth/credentials
            - name: AWS_CONFIG_FILE
              value: /backup-auth/config
            {{- range $key := list "endpoint-a" "bucket-a" "endpoint-b" "bucket-b" }}
            - name: GTM_BACKUP_{{ $key | upper | replace "-" "_" }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "stateBackup.existingSecret required" $.Values.stateBackup.existingSecret | quote }}
                  key: {{ $key }}
            {{- end }}
          resources:
            {{- toYaml .Values.stateBackup.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            exec:
              command: ["python3", "-c", "import pathlib,time,os; p=pathlib.Path('/scratch/last-dual-success'); assert p.is_file() and time.time()-int(p.read_text()) < 3*max(60,int(os.environ['GTM_BACKUP_INTERVAL_SECONDS']))"]
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/data
              readOnly: true
            - name: backup-scratch
              mountPath: /scratch
            - name: backup-auth
              mountPath: /backup-auth
              readOnly: true
            - name: backup-account-config
              mountPath: /config/account
              readOnly: true
            {{- if .Values.billing.existingSecret }}
            - name: backup-billing-config
              mountPath: /config/billing
              readOnly: true
            {{- end }}
            {{- if .Values.mail.existingSecret }}
            - name: backup-smtp-config
              mountPath: /config/smtp
              readOnly: true
            {{- end }}
            {{- if .Values.mailIngress.enabled }}
            - name: backup-mail-ingress-config
              mountPath: /config/mail-ingress
              readOnly: true
            - name: backup-mail-ingress-tls
              mountPath: /config/mail-tls
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        {{- if .Values.stateBackup.enabled }}
        - name: backup-scratch
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.stateBackup.scratchSize | quote }}
        - name: backup-auth
          secret:
            secretName: {{ .Values.stateBackup.existingSecret | quote }}
        - name: backup-account-config
          secret:
            secretName: {{ .Values.existingSecret | quote }}
        {{- if .Values.billing.existingSecret }}
        - name: backup-billing-config
          secret:
            secretName: {{ .Values.billing.existingSecret | quote }}
        {{- end }}
        {{- if .Values.mail.existingSecret }}
        - name: backup-smtp-config
          secret:
            secretName: {{ .Values.mail.existingSecret | quote }}
        {{- end }}
        {{- if .Values.mailIngress.enabled }}
        - name: backup-mail-ingress-config
          secret:
            secretName: {{ .Values.mailIngress.tokenSecret | quote }}
        - name: backup-mail-ingress-tls
          secret:
            secretName: {{ .Values.mailIngress.tlsSecret | quote }}
        {{- end }}
        {{- end }}
        - name: data
          persistentVolumeClaim:
            claimName: gtm-control-plane-data
