# Configure version-pinned container images before production rollout.
namespace: gtm-system
image:
  repository: gtm/controlplane
  tag: dev
syncImage: gtm/sync:dev
historyImage: gtm/history:dev
existingSecret: controlplane-secrets
billing:
  existingSecret: "" # manually created private Kubernetes Secret
mail:
  existingSecret: "" # manually created SMTP Secret; required for Production
encryptedArchive:
  lfsEnabled: false
  wormBackupEnabled: false
# One shared SMTP gateway for the entire installation; not per tenant.
# Must have a real MX/A record, public port 25, STARTTLS cert and a private
# ingress token shared only with the internal Control Plane.
adminApi:
  enabled: false # only enable behind a private SSO/MFA operator gateway
mailIngress:
  enabled: false
  domain: "" # e.g. inbox.gettingthingsmarkdown.example
  image: gtm/mail-ingress:dev
  tlsSecret: "" # existing Kubernetes TLS secret (tls.crt, tls.key)
  tokenSecret: "" # existing Secret (mail-ingress-token, >=32 chars)
  serviceType: LoadBalancer
  externalPort: 25
  containerPort: 2525
recovery:
  failoverTargetCloud: "" # operator-only, empty in normal operation
  fenceAcknowledged: false # manually fence lost provider BEFORE switching
  ageRecipient: "" # public key only; keep age private key outside BOTH clouds
placement:
  syncCloud: "" # e.g. hetzner (set both or neither)
  historyCloud: "" # e.g. ovh
storage:
  controlPlaneGi: 2
  className: ""
  syncClassName: ""
  historyClassName: ""
api:
  host: api.example.invalid
  ingressEnabled: false
  tlsSecret: gtm-api-tls
  issuerName: ""
  ingressClassName: nginx
development:
  enabled: false
  longTrial: false
  tenantVolumeGi: 0
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Shared Control Plane state only. Credentials for two independent S3 providers
# are mounted exclusively into the backup container. Never supply age identities.
stateBackup:
  enabled: false
  image: gtm/controlplane-backup:dev
  existingSecret: ""
  intervalSeconds: 300
  scratchSize: 1Gi
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 1536Mi
