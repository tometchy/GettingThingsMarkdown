apiVersion: v1
kind: Namespace
metadata:
  name: gtm-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gtm-controller
  namespace: gtm-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gtm-controller
rules:
  - apiGroups: [""]
    resources: [namespaces, secrets, services, persistentvolumeclaims]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gtm-controller
subjects:
  - kind: ServiceAccount
    name: gtm-controller
    namespace: gtm-system
roleRef:
  kind: ClusterRole
  name: gtm-controller
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gtm-control-plane-data
  namespace: gtm-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controlplane
  namespace: gtm-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: gtm-controlplane
  template:
    metadata:
      labels:
        app: gtm-controlplane
    spec:
      serviceAccountName: gtm-controller
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: controlplane
          image: gtm/controlplane:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Development
            - name: GTM_KUBE_ENABLED
              value: "true"
            - name: GTM_DEV_LONG_TRIAL
              value: "true"
            - name: GTM_DEV_VOLUME_GI
              value: "2"
            - name: GTM_SYNC_IMAGE
              value: gtm/sync:dev
            - name: GTM_HISTORY_IMAGE
              value: gtm/history:dev
            - name: GTM_DB
              value: Data Source=/app/data/accounts.sqlite
            - name: GTM_PROVISIONING_DB
              value: Data Source=/app/data/tenants.sqlite
            - name: GTM_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: controlplane-secrets
                  key: jwt
            - name: GTM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: controlplane-secrets
                  key: admin
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gtm-control-plane-data
---
apiVersion: v1
kind: Service
metadata:
  name: controlplane
  namespace: gtm-system
spec:
  selector:
    app: gtm-controlplane
  ports:
    - name: http
      port: 8080
      targetPort: 8080
